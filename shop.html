<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="format-detection" content="telephone=no">
<title>FaasKids — Grow with Style</title>
<meta name="description" content="Kids’ backpacks, lunch gear, clothing and shoes. Combo deals and nationwide delivery across Nigeria.">
<link rel="icon" type="image/jpeg" href="logo.jpg">
<link rel="apple-touch-icon" href="logo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/shop.css">
</head>
<body>
<div class="announce" id="announce"></div>

<header class="hdr">
  <div class="hdr-in">
    <a class="logo" href="#/"><img src="logo.jpg" alt=""><span><b class="b1">Faas</b><b class="b2">Kids</b></span></a>
    <form class="search" id="searchForm" role="search">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
      <input id="searchInput" type="search" placeholder="Search backpacks, dresses, shoes…" aria-label="Search products" autocomplete="off">
    </form>
    <nav class="hdr-icons">
      <a href="#/track" aria-label="Track my orders" title="My orders"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4.5-6 8-6s7 2 8 6"/></svg></a>
      <a href="#/saved" aria-label="Saved items" title="Saved"><svg viewBox="0 0 24 24"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg><i class="badge" id="savedCount"></i></a>
      <button id="bagBtn" aria-label="Shopping bag" title="Bag"><svg viewBox="0 0 24 24"><path d="M5 8h14l-1.2 12H6.2z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg><i class="badge" id="bagCount"></i></button>
    </nav>
  </div>
  <nav class="catnav" id="catnav"></nav>
</header>

<main id="app" tabindex="-1"></main>

<footer class="ftr" id="footer"></footer>

<!-- bag drawer -->
<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-label="Shopping bag" aria-hidden="true">
  <div class="drawer-hd">
    <h2>Your bag</h2>
    <button class="x" id="drawerClose" aria-label="Close">✕</button>
  </div>
  <div class="drawer-bd" id="drawerBody"></div>
</aside>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script type="module" src="assets/shop.js"></script>
</body>
</html>
